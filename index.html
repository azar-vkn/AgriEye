<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriEye — Spatial Intelligence for Indian Agriculture</title>
  <meta name="description" content="See the farm. Understand the risk. Act earlier. A spatial intelligence globe for Indian agriculture built on open weather, satellite and geographic data." />
  <link rel="icon" type="image/svg+xml" href="/agrieye/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/agriculture/styles/agrieye.css" />
</head>
<body class="ae">
  <div id="cesiumContainer"></div>
  <div class="ae-vignette" aria-hidden="true"></div>

  <header id="ae-brand">
    <span class="ae-logo" data-logo-gaze data-logo-src="/agrieye/logo.svg" aria-hidden="true"><img src="/agrieye/logo.svg" alt="" /></span>
    <div class="ae-brand-text">
      <h1>AGRI <span>EYE</span></h1>
      <p class="ae-tagline">SPATIAL INTELLIGENCE FOR AGRICULTURE</p>
      <p class="ae-system" id="ae-system" data-tone="busy"><span class="ae-dot"></span><span id="ae-system-text">INITIALIZING</span></p>
    </div>
  </header>

  <nav id="ae-context" aria-label="Geographic context">
    <ol id="ae-crumbs"><li><button data-crumb="india">INDIA</button></li></ol>
    <span id="ae-mode-chip" class="ae-mode-chip" data-mode="live" title="Live mode fetches the latest available open data. Each source shows its own freshness.">LIVE MODE</span>
  </nav>

  <div id="ae-right">
  <aside id="ae-status" aria-label="Data status">
    <button id="ae-status-toggle" class="ae-status-head" aria-expanded="true" aria-controls="ae-status-body">
      <span>DATA STATUS</span><span class="ae-kbd">D</span>
    </button>
    <div id="ae-status-body">
      <ul id="ae-status-rows"></ul>
      <div class="ae-status-actions">
        <button class="ae-text-btn" data-action="open-sources">Sources &amp; method</button>
        <button class="ae-text-btn" data-action="refresh" title="Re-request the focused state's data">Refresh</button>
        <label class="ae-switch" title="Use the bundled, labelled archive snapshot instead of live requests">
          <input type="checkbox" id="ae-demo-toggle" /><span>Demo dataset</span>
        </label>
      </div>
      <p id="ae-status-alert" class="ae-status-alert" hidden></p>
    </div>
  </aside>
  <aside id="ae-panel" aria-label="Region intelligence" hidden></aside>
  </div>

  <nav id="ae-layers" aria-label="Data layers">
    <div class="ae-rail-title">DATA LAYERS</div>
    <div id="ae-layer-buttons" role="radiogroup" aria-label="Thematic layer"></div>
    <div id="ae-legend" aria-live="polite"></div>
  </nav>

  <section id="ae-sources" aria-label="Sources and method" hidden></section>

  <div id="ae-command">
    <div id="ae-answer" hidden aria-live="polite"></div>
    <form id="ae-command-form" autocomplete="off">
      <span class="ae-command-icon" aria-hidden="true"></span>
      <input id="ae-command-input" type="text" placeholder="Search a place or ask: “Show agricultural water stress in Tamil Nadu”" aria-label="Search or ask AgriEye" aria-autocomplete="list" aria-controls="ae-suggest" />
      <button type="button" id="ae-speak" class="ae-icon-btn" aria-pressed="false" title="Read answers aloud"></button>
      <button type="button" id="ae-mic" class="ae-icon-btn" title="Voice command (browser speech recognition)"></button>
      <button type="submit" id="ae-send" class="ae-icon-btn" title="Ask"></button>
    </form>
    <ul id="ae-suggest" role="listbox" hidden></ul>
  </div>

  <div id="ae-globe-controls" aria-label="Globe controls"></div>

  <div id="ae-tooltip" role="tooltip" hidden></div>
  <div id="ae-toast" role="status" aria-live="polite"></div>

  <div id="loading-screen">
    <div class="loader-content">
      <img class="loader-logo" src="/agrieye/logo.svg" alt="" />
      <h2>AGRI <span>EYE</span></h2>
      <p class="loader-tagline">See the farm. Understand the risk. Act earlier.</p>
      <p class="loader-status">Initializing globe…</p>
    </div>
  </div>

  <script type="module" src="/src/agriculture/main.js"></script>
</body>
</html>
