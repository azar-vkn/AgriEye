<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="agrieye-logo-title">
  <title id="agrieye-logo-title">AgriEye</title>
  <!-- Eye: a single almond outline. -->
  <path d="M4 32C13 18.5 22.5 13 32 13s19 5.5 28 19c-9 13.5-18.5 19-28 19S13 45.5 4 32Z" fill="none" stroke="#eef6ef" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Iris: a leaf over field furrows. The group id lets the shared gaze effect move it. -->
  <g id="globe">
    <circle cx="32" cy="32" r="11.5" fill="#0b120d" stroke="#86dd92" stroke-width="2"/>
    <path d="M24.5 36.5c4-1.6 11-1.6 15 0M23.8 32.8c4.4-1.4 12-1.4 16.4 0" fill="none" stroke="#86dd92" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    <path d="M32 22.5c-5 3.2-6.2 9.2-3.2 13.8 1 1.5 2.2 2.5 3.2 3.2 1-.7 2.2-1.7 3.2-3.2 3-4.6 1.8-10.6-3.2-13.8Z" fill="#86dd92"/>
    <path d="M32 26v12.5" stroke="#0b120d" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
